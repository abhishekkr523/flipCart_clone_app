<div class="my-order">
    <h1>My Orders</h1>

    <app-loading-spinner *ngIf="loading"></app-loading-spinner>

    <app-empty-state
        *ngIf="!loading && orderData?.length === 0"
        message="You have no orders yet.">
    </app-empty-state>

    <ng-container *ngIf="!loading && orderData?.length">
        <div class="row header-row">
            <div class="col-sm-2">
                <span>Order</span>
            </div>
            <div class="col-sm-2">
                <span>Order Id</span>
            </div>
            <div class="col-sm-2">
                <span>Price</span>
            </div>
            <div class="col-sm-2">
                <span>Status</span>
            </div>
            <div class="col-sm-2">
                <span>Action</span>
            </div>
        </div>
        <div class="row order-data" *ngFor="let item of orderData">
            <div class="col-sm-2">
                <span><img src="https://icon-library.com/images/items-icon/items-icon-7.jpg" alt=""
                        style="width: 62px;"></span>
            </div>
            <div class="col-sm-2">
                <span>#{{item.id}}</span>
            </div>
            <div class="col-sm-2">
                <span>₹{{item.totalPrice}}</span>
            </div>
            <div class="col-sm-2">
                <span class="status" [ngClass]="{
                    'status--placed': (item.status || 'Placed') === 'Placed' || item.status === 'Shipped',
                    'status--delivered': item.status === 'Delivered',
                    'status--cancelled': item.status === 'Cancelled'
                }">{{item.status || 'Placed'}}</span>
            </div>
            <div class="col-sm-2">
                <span>
                    <button
                        *ngIf="item.status !== 'Cancelled' && item.status !== 'Delivered'"
                        (click)="cancelOrder(item.id)">Cancel Order</button>
                </span>
            </div>
        </div>
    </ng-container>
</div>
